<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{common/head :: head}"></head>

<body class="bg-light text-dark">

	<div th:replace="~{common/head :: header}"></div>

	<main class="container my-5">
		<div class="card shadow-lg border-0" style="max-width: 650px; margin: 0 auto;">
			<div class="card-body p-4">

				<h2 class="text-center text-primary mb-4">勤怠削除確認</h2>

				<div class="alert alert-warning text-left mb-4">
					<p class="mb-1">以下の勤怠データを削除します。</p>
					<p class="mb-0">この操作は取り消せません。よろしいですか？</p>
				</div>

				<div class="border rounded p-3 mb-4 bg-white">
					<div class="row mb-2">
						<div class="col-sm-4 fw-bold text-end">社員名：</div>
						<div class="col-sm-8" th:text="${attendance.employeeName}">山田太郎</div>
					</div>
					<div class="row mb-2">
						<div class="col-sm-4 fw-bold text-end">勤務日：</div>
						<div class="col-sm-8" th:text="${#temporals.format(attendance.workDate, 'yyyy/MM/dd')}">
							2025/11/03</div>
					</div>
					<div class="row mb-2">
						<div class="col-sm-4 fw-bold text-end">出勤時刻：</div>
						<div class="col-sm-8" th:text="${attendance.checkInTimeText}">09:00</div>
					</div>
					<div class="row mb-2">
						<div class="col-sm-4 fw-bold text-end">退勤時刻：</div>
						<div class="col-sm-8" th:text="${attendance.checkOutTimeText}">17:30</div>
					</div>
					<div class="row">
						<div class="col-sm-4 fw-bold text-end">勤務時間：</div>
						<div class="col-sm-8" th:text="${attendance.workDurationText}">8時間30分</div>
					</div>
				</div>

				<form th:action="@{/attendance/delete}" method="post">
					<input type="hidden" name="id" th:value="${attendance.id}">
					<div class="d-flex justify-content-start">
						<button type="submit" class="btn btn-danger me-3 px-4">削除</button>
						<a th:href="@{/attendance/list}" class="btn btn-outline-secondary px-4">キャンセル</a>
					</div>
				</form>

			</div>
		</div>
	</main>
</body>

</html>
