<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{common/head :: head}"></head>

<body class="bg-light text-dark">

	<!-- 共通ヘッダー -->
	<div th:replace="~{common/head :: header}"></div>

	<main class="container py-4">

		<h2 class="mb-4 text-primary fw-bold text-center">勤務一覧</h2>

		<!-- サービス例外用エラー表示 -->
		<div th:if="${error}" class="alert alert-danger text-center" th:text="${error}"></div>

		<table class="table table-striped table-hover align-middle shadow-sm">
			<thead class="table-primary text-center">
				<tr>
					<th style="white-space: nowrap; min-width: 140px;">社員名</th>
					<th style="white-space: nowrap;">勤務日</th>
					<th style="white-space: nowrap;">出勤時刻</th>
					<th style="white-space: nowrap;">退勤時刻</th>
					<th style="white-space: nowrap;">勤務時間</th>
					<th style="white-space: nowrap; min-width: 140px;">操作</th>
				</tr>
			</thead>

			<tbody>
				<!-- 勤怠一覧ループ -->
				<tr th:each="attendance : ${attendanceList}" class="text-center">
					<!-- 社員名 -->
					<td th:text="${attendance.employeeName}" style="white-space: nowrap;"></td>

					<!-- 勤務日 -->
					<td th:text="${attendance.workDateText}">2025/11/03</td>

					<!-- 出勤時刻 -->
					<td th:text="${attendance.checkInTimeText}">09:00</td>

					<!-- 退勤時刻 -->
					<td th:text="${attendance.checkOutTimeText}">17:30</td>

					<!-- 勤務時間 -->
					<td>
					    <span th:text="${attendance.workTime}"></span>
					    <br th:if="${attendance.breakInfo != null}" />
					    <small th:text="${attendance.breakInfo}"></small>
					</td>

					<!-- 操作ボタン -->
					<td>
						<div class="d-flex justify-content-center gap-2">
							<a th:href="@{/attendance/edit/{id}(id=${attendance.id})}"
								class="btn btn-sm btn-outline-primary">編集</a>
							<a th:href="@{/attendance/delete/{id}(id=${attendance.id})}"
								class="btn btn-sm btn-outline-danger">削除</a>
						</div>
					</td>
				</tr>
			</tbody>
		</table>

		<div class="mt-4 text-start">
			<a th:href="@{/attendance/punch}" class="btn btn-outline-secondary">&larr; 打刻画面へ戻る</a>
		</div>

	</main>
</body>

</html>
