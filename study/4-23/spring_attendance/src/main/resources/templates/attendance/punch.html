<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{common/head :: head}"></head>

<body class="bg-light text-dark">

	<header class="bg-primary text-white py-3 mb-4 shadow">
		<div class="container">
			<h1 class="h3 mb-0">簡易勤怠管理アプリ</h1>
		</div>
	</header>

	<main class="container">

		<h2 class="mb-3">出勤・退勤打刻</h2>

		<form th:action="@{/attendance/punch}" th:object="${attendanceForm}" method="post"
			class="p-4 rounded bg-white shadow-sm">

			<!-- フォーム内に全体エラーメッセージを配置 -->
			<div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
				<strong>入力内容に誤りがあります。各項目をご確認ください。</strong>
				<ul class="mb-0 mt-2">
					<li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
				</ul>
			</div>

			<!-- 社員名 -->
			<div class="mb-3 row align-items-center">
				<label for="employeeName" class="col-sm-2 col-form-label fw-bold">社員名：</label>
				<div class="col-sm-4">
					<input type="text" th:field="*{employeeName}" id="employeeName" class="form-control">
				</div>
				<div class="col-sm-6 text-muted small">例：山田　太郎（姓と名の間に全角スペース）</div>
			</div>

			<!-- 勤務日 -->
			<div class="mb-3 row align-items-center">
				<label for="workDate" class="col-sm-2 col-form-label fw-bold">勤務日：</label>
				<div class="col-sm-4">
					<input type="date" th:field="*{workDate}" id="workDate" class="form-control">
				</div>
			</div>

			<!-- 出勤時刻 -->
			<div class="mb-3 row align-items-center">
				<label for="checkInTime" class="col-sm-2 col-form-label fw-bold">出勤時刻：</label>
				<div class="col-sm-4">
					<input type="time" th:field="*{checkInTime}" id="checkInTime" class="form-control">
				</div>
			</div>

			<!-- 退勤時刻 -->
			<div class="mb-3 row align-items-center">
				<label for="checkOutTime" class="col-sm-2 col-form-label fw-bold">退勤時刻：</label>
				<div class="col-sm-4">
					<input type="time" th:field="*{checkOutTime}" id="checkOutTime" class="form-control">
				</div>
			</div>

			<!-- ボタン -->
			<div class="d-flex gap-3 mt-4">
				<button type="submit" name="action" value="checkIn" class="btn btn-success px-4">出勤</button>
				<button type="submit" name="action" value="checkOut" class="btn btn-danger px-4">退勤</button>
			</div>

			<div class="mt-3 text-left">
				<a th:href="@{/attendance/list}" class="btn btn-outline-primary px-4 ms-auto">勤怠一覧へ</a>
			</div>

		</form>
	</main>

</body>

</html>
